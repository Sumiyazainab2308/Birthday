<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise Card - Pauline</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0b0f19;
            --accent-pink: #c7a76c;
            --text-dark: #fdfbf7;
        }
        body {
            background-color: #eee;
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; font-family: 'Montserrat', sans-serif;
        }
        .card-container {
            display: flex; gap: 40px; flex-wrap: wrap; justify-content: center;
        }
        .card {
            width: 400px; height: 600px;
            background-color: var(--bg-main);
            color: var(--text-dark);
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            padding: 40px;
            position: relative;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center;
            border: 1px solid rgba(199, 167, 108, 0.3);
        }
        .card::before {
            content: '';
            position: absolute; top: 15px; left: 15px; right: 15px; bottom: 15px;
            border: 1px dashed var(--accent-pink);
            border-radius: 8px; pointer-events: none; opacity: 0.5;
        }
        .title {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: var(--accent-pink);
            margin-bottom: 20px;
        }
        .subtitle { font-size: 1.1rem; margin-bottom: 40px; font-weight: 300; letter-spacing: 1px; }
        .qr-placeholder {
            width: 220px; height: 220px;
            background: #fff;
            display: flex; align-items: center; justify-content: center;
            border-radius: 8px; margin-bottom: 40px;
            color: #000; font-family: monospace; font-size: 0.9rem;
            border: 4px solid var(--accent-pink);
            box-shadow: 0 0 30px rgba(199, 167, 108, 0.2);
        }
        .handwriting {
            font-family: 'Caveat', cursive;
            font-size: 1.8rem;
            color: var(--text-dark);
            opacity: 0.9;
        }
        
        .print-btn {
            margin-bottom: 40px; padding: 12px 30px; font-size: 1.2rem; cursor: pointer;
            background: var(--bg-main); color: var(--accent-pink); border: 2px solid var(--accent-pink);
            border-radius: 30px; font-family: 'Montserrat', sans-serif; font-weight: 600;
        }
        @media print {
            body { background: #fff; padding: 0; }
            .print-btn { display: none; }
            .card-container { gap: 20px; }
            .card { box-shadow: none; border: 1px solid #ccc; break-inside: avoid; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
    </style>
</head>
<body>

    <button class="print-btn" onclick="window.print()">🖨 Print Cards</button>

    <div class="card-container">
        <!-- Front of Card -->
        <div class="card">
            <h1 class="title">For Pauline ♡</h1>
            <p class="subtitle">There's something waiting for you.<br><br>Scan when you're ready.</p>
            
            <div class="qr-placeholder" style="text-align: center;">
                [ REPLACE WITH YOUR <br><br> WEBSITE URL <br><br> QR CODE ]
            </div>
            
            <p class="handwriting">Don't ask me what's inside.<br>Just scan it. 👀</p>
        </div>

        <!-- Back of Card -->
        <div class="card">
            <h1 class="title" style="font-size: 2rem;">One little rule:</h1>
            <p class="handwriting" style="font-size: 2.2rem; margin-top: 20px;">Don't skip anything.</p>
            <p style="margin-top: auto; font-size: 0.9rem; letter-spacing: 2px; opacity: 0.5;">YOURWEBSITE.COM</p>
        </div>
    </div>

</body>
</html>
